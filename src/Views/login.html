<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Connexion - CVConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <!-- En-tête si nécessaire -->
  <!-- <div id="header-placeholder"></div> -->

  <div class="login-wrapper">
    <div class="login-banner">
      <img src="public/image/logo-cvconnect.png" alt="Logo CVConnect" class="banner-logo" />
      <p>La plateforme simple et rapide pour recruter ou trouver un emploi.</p>
    </div>
    

    <main class="login-form-area">
      <section class="form-card">
        <h2>Bienvenue 👋</h2>
        <p class="form-subtitle">Connectez-vous à votre tableau de bord</p>

        <form id="login-form">
          <input type="email" name="email" placeholder="Adresse email" required />
          <input type="password" name="password" placeholder="Mot de passe" required />
          <div class="forgot-password">
          <a href="reset-password.html">Mot de passe oublié ?</a>
        </div>

          <button type="submit">Se connecter</button>
        </form>

        <p class="form-footer">
          Pas encore de compte ? <a href="register.html">Créer un compte</a>
        </p>
      </section>
    </main>
  </div>

  <div class="alert-container"></div>

  <script type="module" src="js/components.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
