<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Réinitialisation du mot de passe - CVConnect</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/reset-password.css" />
</head>
<body>
  <main class="reset-wrapper">
    <section class="form-card">
      <h2>🔒 Mot de passe oublié ?</h2>

      <!-- Étape 1 : demander le lien -->
      <form id="reset-request-form">
        <input type="email" name="email" placeholder="Adresse email" required />
        <button type="submit">Recevoir un lien</button>
      </form>

      <div class="alert-container"></div>
      <a href="login.html" class="back-link">← Retour à la connexion</a>
    </section>
  </main>

  <!-- ✅ Modale réinitialisation -->
  <div id="reset-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3>Réinitialiser le mot de passe</h3>
      <form id="reset-password-form">
        <input type="hidden" name="token" />
        <input type="password" name="newPassword" placeholder="Nouveau mot de passe" required />
        <input type="password" name="confirmPassword" placeholder="Confirmer le mot de passe" required />
        <button type="submit">Valider</button>
        <button type="button" id="modal-close-btn" class="btn-secondary">Annuler</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/reset-password.js"></script>
</body>
</html>
